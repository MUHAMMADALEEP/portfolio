  <main>
    <section>
      <h1>Contact Me</h1>
      <div class="contact-layout">

        <form id="contact-form" novalidate>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name">
            <small class="error" id="name-error"></small>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email">
            <small class="error" id="email-error"></small>
          </div>

          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject">
            <small class="error" id="subject-error"></small>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"></textarea>
            <small class="error" id="message-error"></small>
          </div>

          <button type="submit" class="btn">Send Message</button>
          <p id="form-success" class="success"></p>
        </form>

        <aside class="contact-info">
          <h2>Get in Touch</h2>
          <ul>
            <li>Email: <a href="mailto:noralif62@gmail.com">noralif62@gmail.com</a></li>
            <li>GitHub: <a href="https://github.com/MUHAMMADALEEP">MUHAMMADALEEP</a></li>
            <li>LinkedIn: <a href="https://www.linkedin.com/">My LinkedIn</a></li>
            <li>Location: Pahang, Malaysia</li>
          </ul>
        </aside>

      </div>
    </section>
